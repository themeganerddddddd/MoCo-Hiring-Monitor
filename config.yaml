daily:
  # Searches the previous week but stores only jobs not already in the database.
  date_posted: "week"
  num_pages: 5

  queries:
    - "in Montgomery County, MD"
    - "in Rockville, MD"
    - "in Bethesda, MD"
    - "in Silver Spring, MD"
    - "in Gaithersburg, MD"
    - "in Germantown, MD"
